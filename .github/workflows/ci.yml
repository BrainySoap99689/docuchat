name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_NAME: app_db_test
      DB_USER: postgres
      DB_PASSWORD: postgres

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Check Python syntax
        run: |
          python -m compileall .

      - name: Create test database schema
        run: |
          PGPASSWORD=postgres psql \
            -h localhost \
            -U postgres \
            -d app_db_test \
            -c "CREATE TABLE IF NOT EXISTS document_names (
                  id SERIAL PRIMARY KEY,
                  document_name TEXT NOT NULL
                );"
            -c "CREATE TABLE IF NOT EXISTS document_chunks (
                  id SERIAL PRIMARY KEY,
                  document_name TEXT NOT NULL,
                  page_number INTEGER,
                  chunk_text TEXT NOT NULL,
                  embedding VECTOR(384)
                );"

      - name: Run documents test
        run: pytest tests/test_documents.py -v

      - name: Run upload test
        run: pytest tests/test_upload.py -v

      - name: Run chat test
        run: pytest tests/test_chat.py -v

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Build frontend
        run: npm run build